<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Godot Cascade — Leaderboard</title>
<style>
  :root { --bg:#0a0612; --card:#160d22; --hot:#ff8c1a; --gold:#ffd24a; --cyan:#5ef2ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #fff; background: radial-gradient(1200px 800px at 50% -10%, #1d1030 0%, var(--bg) 60%);
    display: flex; flex-direction: column; align-items: center; padding: 32px 16px;
  }
  h1 { margin: 0 0 4px; font-size: clamp(28px, 6vw, 48px); letter-spacing: .5px;
       background: linear-gradient(90deg, var(--hot), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: #b9a9d6; margin: 0 0 24px; font-size: 14px; }
  table { width: min(560px, 100%); border-collapse: collapse; background: var(--card);
          border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  th, td { padding: 14px 18px; text-align: left; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #b9a9d6; background: #1f1430; }
  tr + tr td { border-top: 1px solid #271838; }
  td.rank { width: 56px; font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; }
  td.score { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); }
  tr:nth-child(2) td.rank { color: var(--gold); font-size: 18px; }
  .name { font-weight: 600; letter-spacing: 1px; }
  .empty, .err { color: #b9a9d6; margin-top: 24px; }
  .foot { margin-top: 20px; color: #6f5f8c; font-size: 12px; }
  .foot a { color: var(--cyan); }
</style>
</head>
<body>
  <h1>Godot Cascade</h1>
  <p class="sub">Most points in 30 seconds · global top 20</p>
  <table id="board" hidden>
    <thead><tr><th>#</th><th>Player</th><th style="text-align:right">Score</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="status" class="empty">Loading…</p>
  <p class="foot">A Godot Apple Vision Pro sample by
     <a href="https://github.com/ibrews/godot-avp-cascade">@ibrews</a></p>

<script>
  // Paste your Apps Script /exec URL here after deploying Code.gs.
  const LEADERBOARD_URL = "https://script.google.com/macros/s/AKfycbzfnTbrGnRE0ANAVujqDWRyYi_eub7HOvS-m3uI3WY-ysMw0LohX3d48iyE7D86jn5R/exec";

  async function load() {
    const status = document.getElementById('status');
    const board = document.getElementById('board');
    const rows = document.getElementById('rows');
    if (LEADERBOARD_URL.startsWith("PUT_")) { status.textContent = "Set LEADERBOARD_URL in index.html."; return; }
    try {
      const res = await fetch(LEADERBOARD_URL + "?top=20", { method: "GET" });
      const data = await res.json();
      if (!data.ok || !data.scores || data.scores.length === 0) { status.textContent = "No scores yet — be the first!"; return; }
      rows.innerHTML = "";
      data.scores.forEach((s, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="rank">${i + 1}</td><td class="name">${escapeHtml(s.name)}</td><td class="score">${s.score.toLocaleString()}</td>`;
        rows.appendChild(tr);
      });
      status.hidden = true; board.hidden = false;
    } catch (err) { status.className = "err"; status.textContent = "Could not load leaderboard."; }
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  load(); setInterval(load, 15000);
</script>
</body>
</html>
